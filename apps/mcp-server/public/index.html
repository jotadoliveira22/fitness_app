<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fitness App — MCP Tester</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    display: flex;
    min-height: 100vh;
  }
  aside {
    width: 340px;
    flex-shrink: 0;
    background: #151821;
    border-right: 1px solid #2a2f3a;
    padding: 20px;
    overflow-y: auto;
  }
  main { flex: 1; padding: 20px; overflow-y: auto; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: #8b93a7; font-size: 12px; margin-bottom: 20px; }
  label { display: block; font-size: 12px; color: #8b93a7; margin: 12px 0 4px; }
  input, select, textarea, button {
    width: 100%;
    background: #1c2029;
    border: 1px solid #2a2f3a;
    color: #e6e6e6;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  textarea { font-family: ui-monospace, "SF Mono", Menlo, monospace; resize: vertical; }
  button {
    background: #3b5bfd;
    border: none;
    cursor: pointer;
    font-weight: 600;
    margin-top: 8px;
  }
  button:hover { background: #2f4bd8; }
  button.secondary { background: #2a2f3a; }
  button.secondary:hover { background: #343a47; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  pre {
    background: #0b0d12;
    border: 1px solid #2a2f3a;
    border-radius: 6px;
    padding: 12px;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 70vh;
    overflow-y: auto;
  }
  .status { font-size: 12px; padding: 8px 10px; border-radius: 6px; margin-bottom: 12px; }
  .status.ok { background: #16351f; color: #7ee89a; }
  .status.err { background: #3a1a1a; color: #ff9a9a; }
  .status.info { background: #1a2740; color: #8fb4ff; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .presets button { width: auto; flex: none; font-size: 11px; padding: 4px 8px; margin: 0; }
  .token-box { font-size: 10px; word-break: break-all; color: #6b7280; max-height: 60px; overflow-y: auto; }
  section + section { margin-top: 24px; }
</style>
</head>
<body>
  <aside>
    <h1>Fitness App</h1>
    <div class="sub">MCP Tester — harness de testing, no es la UI del producto</div>

    <div id="auth-status" class="status info">No autenticado</div>

    <div id="auth-form">
      <label>Email</label>
      <input id="email" type="email" placeholder="vos@ejemplo.com" />
      <label>Contraseña</label>
      <input id="password" type="password" placeholder="••••••••" />
      <div class="row">
        <button id="btn-signup" class="secondary">Crear cuenta</button>
        <button id="btn-login">Ingresar</button>
      </div>
    </div>

    <div id="auth-actions" style="display:none">
      <label>Access token (se manda automáticamente a cada tool)</label>
      <div id="token-box" class="token-box"></div>
      <button id="btn-logout" class="secondary">Cerrar sesión</button>
    </div>
  </aside>

  <main>
    <section>
      <label>Tool</label>
      <select id="tool-select"><option>(cargando lista de tools...)</option></select>
      <div id="tool-description" class="sub"></div>

      <label>Presets</label>
      <div id="presets" class="presets"></div>

      <label>Argumentos (JSON, sin accessToken — se agrega solo)</label>
      <textarea id="args" rows="14">{}</textarea>

      <button id="btn-call">Llamar tool</button>
    </section>

    <section>
      <label>Respuesta</label>
      <pre id="output">—</pre>
    </section>
  </main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://zopqqsdgfyyavnlqhfca.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvcHFxc2RnZnl5YXZubHFoZmNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NjY2MzMsImV4cCI6MjEwNTE0MjYzM30.2M3Xk1fzCfTw6uyQk9tQsHqkc6dmFfn0dCu104-n7PA";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
let accessToken = null;
let tools = [];

function setStatus(el, text, kind) {
  el.textContent = text;
  el.className = "status " + kind;
}

async function refreshSession() {
  const { data } = await supabase.auth.getSession();
  if (data.session) {
    accessToken = data.session.access_token;
    setStatus($("auth-status"), `Autenticado: ${data.session.user.email}`, "ok");
    $("auth-form").style.display = "none";
    $("auth-actions").style.display = "block";
    $("token-box").textContent = accessToken;
  } else {
    accessToken = null;
    setStatus($("auth-status"), "No autenticado", "info");
    $("auth-form").style.display = "block";
    $("auth-actions").style.display = "none";
  }
}

$("btn-signup").addEventListener("click", async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  const { error } = await supabase.auth.signUp({ email, password });
  if (error) {
    setStatus($("auth-status"), "Error al crear cuenta: " + error.message, "err");
    return;
  }
  setStatus(
    $("auth-status"),
    "Cuenta creada. Si tu proyecto pide confirmar email, confirmalo y después iniciá sesión.",
    "info",
  );
});

$("btn-login").addEventListener("click", async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) {
    setStatus($("auth-status"), "Error al ingresar: " + error.message, "err");
    return;
  }
  await refreshSession();
});

$("btn-logout").addEventListener("click", async () => {
  await supabase.auth.signOut();
  await refreshSession();
});

async function callMcp(method, params) {
  const res = await fetch("/api/mcp", {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json, text/event-stream" },
    body: JSON.stringify({ jsonrpc: "2.0", id: Date.now(), method, params }),
  });
  const text = await res.text();
  // El transporte responde como SSE ("event: message\ndata: {...}") o JSON plano.
  const dataLine = text.split("\n").find((line) => line.startsWith("data: "));
  const jsonText = dataLine ? dataLine.slice(6) : text;
  return JSON.parse(jsonText);
}

async function loadTools() {
  try {
    const response = await callMcp("tools/list", {});
    tools = response.result?.tools ?? [];
    const select = $("tool-select");
    select.innerHTML = "";
    for (const tool of tools) {
      const opt = document.createElement("option");
      opt.value = tool.name;
      opt.textContent = tool.name;
      select.appendChild(opt);
    }
    updateToolDescription();
    renderPresets();
  } catch (err) {
    $("output").textContent = "No se pudo cargar la lista de tools: " + err;
  }
}

function currentTool() {
  return tools.find((t) => t.name === $("tool-select").value);
}

function updateToolDescription() {
  const tool = currentTool();
  $("tool-description").textContent = tool?.description ?? "";
}

const PRESETS = {
  get_today: {},
  get_server_status: {},
  manage_profile: {},
  manage_nutrition: {},
  manage_fasting: {},
  save_profile_setup: {
    displayName: "Usuario de Prueba",
    dateOfBirth: "1995-05-20",
    biologicalSex: "unspecified",
    heightCm: 175,
    weightKg: 78,
    trainingContext: "gym",
    experienceLevel: "beginner",
    trainingDaysPerWeek: 3,
    preferredTrainingDays: [1, 3, 5],
    nutritionPlanIntent: "ai",
    goals: [{ goalType: "lose_fat", target: {} }],
  },
  save_daily_checkin: { energy: 4, sleepQuality: 3, stress: 2 },
  start_fast: { targetHours: 16 },
  finish_fast: {},
  record_body_metrics: { weightKg: 78.5, waistCm: 85 },
  log_meal: { description: "2 huevos y una arepa" },
  generate_ai_nutrition_plan: { activityLevel: "moderate" },
  get_progress: { range: "30d" },
};

function renderPresets() {
  const container = $("presets");
  container.innerHTML = "";
  const tool = currentTool();
  if (!tool || !(tool.name in PRESETS)) return;
  const btn = document.createElement("button");
  btn.className = "secondary";
  btn.textContent = "Ejemplo para " + tool.name;
  btn.addEventListener("click", () => {
    $("args").value = JSON.stringify(PRESETS[tool.name], null, 2);
  });
  container.appendChild(btn);
}

$("tool-select").addEventListener("change", () => {
  updateToolDescription();
  renderPresets();
});

$("btn-call").addEventListener("click", async () => {
  if (!accessToken) {
    $("output").textContent = "Iniciá sesión primero.";
    return;
  }
  const toolName = $("tool-select").value;
  let args;
  try {
    args = JSON.parse($("args").value || "{}");
  } catch (err) {
    $("output").textContent = "El JSON de argumentos es inválido: " + err;
    return;
  }
  $("btn-call").disabled = true;
  $("output").textContent = "Llamando " + toolName + "...";
  try {
    const response = await callMcp("tools/call", {
      name: toolName,
      arguments: { ...args, accessToken },
    });
    $("output").textContent = JSON.stringify(response, null, 2);
  } catch (err) {
    $("output").textContent = "Error: " + err;
  } finally {
    $("btn-call").disabled = false;
  }
});

supabase.auth.onAuthStateChange(() => refreshSession());
await refreshSession();
await loadTools();
</script>
</body>
</html>
